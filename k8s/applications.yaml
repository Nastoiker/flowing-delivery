# account: очередь — не HTTP. API остаётся в одной реплике из-за локального Map сокетов.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: account
  template:
    metadata:
      labels:
        app: account
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      initContainers:
        # Это только проверка TCP при старте, не гарантия здоровья зависимости в работе.
        - name: wait-for-infrastructure
          image: flowing-delivery-backend:senior
          imagePullPolicy: Never
          command: [node, -e]
          args:
            - |
              const net = require('node:net');
              async function wait(host, port) {
                for (let attempt = 0; attempt < 120; attempt++) {
                  const ok = await new Promise(resolve => {
                    const s = net.createConnection({host, port});
                    const done = value => { s.destroy(); resolve(value); };
                    s.setTimeout(1500);
                    s.once('connect', () => done(true));
                    s.once('error', () => done(false));
                    s.once('timeout', () => done(false));
                  });
                  if (ok) return;
                  await new Promise(r => setTimeout(r, 2000));
                }
                throw new Error('Dependency unavailable: ' + host);
              }
              Promise.all([wait('postgres', 5432), wait('rabbitmq', 5672)])
                .catch(e => { console.error(e.message); process.exit(1); });
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
      containers:
        - name: account
          image: flowing-delivery-backend:senior
          imagePullPolicy: Never
          args: [dist/apps/account/main.js]
          envFrom:
            - configMapRef:
                name: delivery-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: delivery-secrets, key: JWT_SECRET}
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef: {name: delivery-secrets, key: AMQP_PASSWORD}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: delivery-secrets, key: DB_PASSWORD}
            - name: AMQP_QUEUE
              value: delivery.account
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # Worker не открывает HTTP: фиктивный HTTP probe дал бы CrashLoopBackOff.
          # Следующее упражнение — реализовать настоящий consumer readiness.
---
