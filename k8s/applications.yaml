# api: очередь — не HTTP. API остаётся в одной реплике из-за локального Map сокетов.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      initContainers:
        # Это только проверка TCP при старте, не гарантия здоровья зависимости в работе.
        - name: wait-for-infrastructure
          image: flowing-delivery-backend:senior
          imagePullPolicy: Never
          command: [node, -e]
          args:
            - |
              const net = require('node:net');
              async function wait(host, port) {
                for (let attempt = 0; attempt < 120; attempt++) {
                  const ok = await new Promise(resolve => {
                    const s = net.createConnection({host, port});
                    const done = value => { s.destroy(); resolve(value); };
                    s.setTimeout(1500);
                    s.once('connect', () => done(true));
                    s.once('error', () => done(false));
                    s.once('timeout', () => done(false));
                  });
                  if (ok) return;
                  await new Promise(r => setTimeout(r, 2000));
                }
                throw new Error('Dependency unavailable: ' + host);
              }
              Promise.all([wait('postgres', 5432), wait('rabbitmq', 5672)])
                .catch(e => { console.error(e.message); process.exit(1); });
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
      containers:
        - name: api
          image: flowing-delivery-backend:senior
          imagePullPolicy: Never
          args: [dist/apps/api/main.js]
          envFrom:
            - configMapRef:
                name: delivery-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: delivery-secrets, key: JWT_SECRET}
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef: {name: delivery-secrets, key: AMQP_PASSWORD}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 3444
          # Startup/liveness check only API; readiness checks the checkout dependencies.
          startupProbe:
            httpGet: {path: /api/health/live, port: 3444}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /api/health/ready, port: 3444}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /api/health/live, port: 3444}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: api-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 3444
      targetPort: 3444
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: flowing-delivery-frontend:senior
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 8080
