version: "3.8"
networks:
  delivery-service:
    driver: bridge
services:
  rmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "15672:15672"
      - "5672:5672"
  db:
    image: postgres:delivery-users
    restart: always
    build:
      context: ./dbs/postgresql
      dockerfile: ./Dockerfile
    env_file:
      - ./dbs/postgresql/.env
    ports:
      - "5432:5432"
    volumes:
      - ./dbdata:/var/lib/postgresql/data
  banner:
    container_name: banner
    restart: always
    ports:
      - "8081:4444"
    env_file:
      - ./delivery-service/envs/.banner.env
    build:
      context: ./delivery-service
      dockerfile: ./apps/banner/Dockerfile
    volumes:
      - ./delivery-service:/app
      - /app/node_modules
    depends_on:
      - rmq
      - db
  payment:
    container_name: payment
    restart: always
    ports:
      - "8082:4443"
    env_file:
      - ./delivery-service/envs/.payment.env
    build:
      context: ./delivery-service
      dockerfile: ./apps/payment/Dockerfile
    volumes:
      - ./delivery-service:/app
      - /app/node_modules
    depends_on:
      - rmq
      - db
  account:
    container_name: account
    restart: always
    ports:
      - "8080:3333"
    env_file:
      - ./delivery-service/envs/.account.env
    build:
      context: ./delivery-service
      dockerfile: ./apps/account/Dockerfile
    volumes:
      - ./delivery-service:/app
      - /app/node_modules
    depends_on:
      - rmq
      - db
  api:
    container_name: api
    restart: always
    env_file:
      - ./delivery-service/envs/.api.env
    build:
      context: ./delivery-service
      dockerfile: ./apps/api/Dockerfile
    volumes:
      - ./delivery-service:/app
      - /app/node_modules
    ports:
      - 3001:3000
      - 3444:3444
    depends_on:
      - rmq
      - db
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: ./docker/Dockerfile
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_module
    environment:
      PORT: ${FRONTEND_HOST_PORT}
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_HOST_PORT}"
volumes:
  dbdata:
